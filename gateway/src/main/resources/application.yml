spring:
  application:
    name: gateway
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity
              uri: ${IDENTITY_URI:http://localhost:8084}
              predicates:
                - Path=/oauth2/**,/.well-known/**,/login,/api/v1/users/**
              filters:
                # STAM-440: identity builds its /login and post-authorize
                # redirects from the Host it sees on the request. Without this,
                # NettyRoutingFilter rewrites Host to the proxied target
                # (identity:8080) — a compose-internal name the browser can't
                # resolve. PreserveHostHeader keeps the original Host (the
                # gateway's own, as the browser addressed it) end to end.
                - PreserveHostHeader
            - id: catalog
              uri: ${CATALOG_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/venues/**,/api/v1/events/**,/api/v1/shows/**,/api/v1/seats/**
            - id: booking
              uri: ${BOOKING_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/reservations/**,/api/v1/bookings/**
            - id: payment
              uri: ${PAYMENT_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/payments/**
            - id: notification
              uri: ${NOTIFICATION_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/notifications/**
          globalcors:
            cors-configurations:
              # STAM-440: scoped to the fetch/XHR surface only. Applying this to
              # /** also covered /login and /oauth2/authorize — pure browser
              # navigations, never same-origin XHR — and Spring's CorsWebFilter
              # rejects ANY Origin it doesn't recognize, including the literal
              # "null" Chromium sends on a same-origin POST navigation from a
              # page served with Referrer-Policy: no-referrer (identity's
              # default Spring Security header). That turned the login form
              # submit into a 403 with no relation to a real cross-origin call.
              '[/api/v1/**]':
                allowed-origins:
                  - ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
                  - http://localhost:5173
                  - https://stampede.vercel.app
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8084/oauth2/jwks}

gateway:
  rate-limit:
    enabled: true
    routes:
      booking:
        replenish-rate: 10
        burst-capacity: 20
        key-type: USER
      identity:
        replenish-rate: 5
        burst-capacity: 10
        key-type: IP

# BFF token handler (ADR-0005). Strips the refresh token from identity's token
# response into an httpOnly cookie; the SPA only ever sees the access token.
bff:
  identity-uri: ${IDENTITY_URI:http://localhost:8084}
  cookie:
    # false only for local dev over plain http; true everywhere a proxy terminates TLS
    secure: ${BFF_COOKIE_SECURE:true}

server:
  port: ${SERVER_PORT:8085}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
